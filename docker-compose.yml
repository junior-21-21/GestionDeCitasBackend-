# ===========================================
# PetyZoos — Docker Compose (Producción)
# Servicios: MySQL 8, Backend (Spring Boot), Frontend (Angular + Nginx)
# ===========================================

services:

  # --- BASE DE DATOS ---
  database:
    image: mysql:8.0
    container_name: petyzoos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: clinica_veterinaria
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - petyzoos_db_data:/var/lib/mysql
    networks:
      - petyzoos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- BACKEND (Spring Boot) ---
  backend:
    build:
      context: ./sistemaWeb
      dockerfile: Dockerfile
    container_name: petyzoos-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Base de datos
      DB_URL: jdbc:mysql://database:3306/clinica_veterinaria?sessionVariables=FOREIGN_KEY_CHECKS=0&createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Perfil de Spring
      SPRING_PROFILE: ${SPRING_PROFILE:-prod}
      DDL_AUTO: ${DDL_AUTO:-update}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Email
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Servidor
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    volumes:
      - petyzoos_uploads:/app/uploads
    networks:
      - petyzoos-network

  # --- FRONTEND (Angular + Nginx) ---
  frontend:
    build:
      context: ../ClinicaVeterinaria_Frontend-master
      dockerfile: Dockerfile
    container_name: petyzoos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8888:80"
    networks:
      - petyzoos-network

# --- REDES ---
networks:
  petyzoos-network:
    driver: bridge

# --- VOLUMENES PERSISTENTES ---
volumes:
  petyzoos_db_data:
    driver: local
  petyzoos_uploads:
    driver: local

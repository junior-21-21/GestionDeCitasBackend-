spring.datasource.url=jdbc:h2:mem:petyzoos_test;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-local-secret-change-before-production-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef
jwt.expirationMs=86400000
app.cors.allowed-origins=http://localhost:4200

spring.mail.username=
spring.mail.password=
logging.level.root=WARN
logging.level.com.farmacia.sistemaWeb=INFO

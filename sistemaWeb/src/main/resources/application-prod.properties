# ===========================================
# PERFIL DE PRODUCCION - Clinica Veterinaria PetyZoos
# Activar con: SPRING_PROFILE=prod
# ===========================================

# Base de datos en modo SEGURO (pero permite override con DDL_AUTO)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# HikariCP optimizado para produccion
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# Logging solo errores criticos
logging.level.root=WARN
logging.level.com.farmacia.sistemaWeb=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF

# Cache de Thymeleaf
spring.thymeleaf.cache=true

# Desactivar devtools en produccion
spring.devtools.restart.enabled=false

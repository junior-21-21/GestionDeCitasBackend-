spring.application.name=PetyZoosVet

# === PERFIL ACTIVO (cambiar a 'prod' en produccion) ===
spring.profiles.active=${SPRING_PROFILE:dev}

# === BASE DE DATOS (SQL Server - Autenticacion de Windows) ===
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=clinica_veterinaria;integratedSecurity=true;encrypt=false;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.encoding=UTF-8

# === JPA / Hibernate ===
# "create" borraba y recreaba todas las tablas en cada arranque (se perdian los datos).
# "update" conserva los datos y solo agrega tablas/columnas nuevas. Para empezar de cero: DDL_AUTO=create.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === HikariCP Connection Pool ===
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# === Servidor ===
server.port=${SERVER_PORT:8080}
# Detras de un proxy (Nginx, Render...), toma la IP real del cliente solo de cabeceras del proxy.
server.forward-headers-strategy=native

# === JWT (NUNCA hardcodear el secret en produccion) ===
# Sin JWT_SECRET: en dev se usa una clave aleatoria por arranque; en otros perfiles la app no arranca.
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# === Archivos / Uploads ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads/veterinarios}

# === Citas: horario de atención (las citas deben empezar y terminar dentro de este rango) ===
app.citas.hora-apertura=${CITAS_HORA_APERTURA:08:00}
app.citas.hora-cierre=${CITAS_HORA_CIERRE:20:00}

# === Historial de demostración (SOLO bases de demo/prueba, nunca la base real) ===
# APP_DEMO_HISTORIAL=true genera al arrancar 30 días de uso simulado (una sola vez). Ver notes/historial-demo/como-generar.md
app.demo.historial=${APP_DEMO_HISTORIAL:false}

# === Primer administrador fuera de dev: POST /api/usuarios/admin con cabecera X-Bootstrap-Token ===
app.bootstrap.admin-token=${ADMIN_BOOTSTRAP_TOKEN:}

# === Consulta de DNI (apisperu). El token vivia en el frontend, a la vista de cualquiera.
# Definir APISPERU_TOKEN en el servidor (.env); no se guarda en el repositorio.
app.apisperu.token=${APISPERU_TOKEN:}

# === URL publica del frontend (enlaces de los correos de recuperacion de contrasena) ===
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# === EMAIL SMTP (credenciales SOLO por variable de entorno) ===
spring.mail.host=smtp.gmail.com
# Puerto 465 con SSL directo: muchas redes/ISP bloquean el 587 (STARTTLS) y el envio fallaba.
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# === CORS (origenes permitidos, separados por coma) ===
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# === Logging ===
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.farmacia.sistemaWeb=INFO
logging.level.org.springframework.security=WARN

# === MERCADOPAGO ===
mercadopago.access-token=${MP_ACCESS_TOKEN:TEST-xxx}

# === STRIPE ===
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_xxx}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_xxx}

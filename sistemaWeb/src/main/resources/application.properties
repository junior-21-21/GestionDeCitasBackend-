spring.application.name=PetyZoosVet

# === PERFIL ACTIVO (cambiar a 'prod' en produccion) ===
spring.profiles.active=${SPRING_PROFILE:dev}

# === BASE DE DATOS ===
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica_veterinaria?sessionVariables=FOREIGN_KEY_CHECKS=0}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.encoding=UTF-8

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === HikariCP Connection Pool ===
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# === Servidor ===
server.port=${SERVER_PORT:8080}

# === JWT (NUNCA hardcodear el secret en produccion) ===
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-ks7d8w93kfhSDF7sd89FDS8dshJ28sd9SHfj38sdfkH23sd89}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# === Archivos / Uploads ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads/veterinarios}

# === EMAIL SMTP (credenciales SOLO por variable de entorno) ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# === CORS (origenes permitidos, separados por coma) ===
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# === Logging ===
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.farmacia.sistemaWeb=INFO
logging.level.org.springframework.security=WARN

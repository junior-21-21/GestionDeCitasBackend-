spring.application.name=PetyZoosVet

# === PERFIL ACTIVO (cambiar a 'prod' en produccion) ===
spring.profiles.active=${SPRING_PROFILE:dev}

# === BASE DE DATOS (SQL Server - Autenticacion de Windows) ===
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=clinica_veterinaria;integratedSecurity=true;encrypt=false;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.encoding=UTF-8

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === HikariCP Connection Pool ===
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# === Servidor ===
server.port=${SERVER_PORT:8080}

# === JWT (NUNCA hardcodear el secret en produccion) ===
jwt.secret=${JWT_SECRET:dev-only-local-secret-change-before-production-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef}
jwt.expirationMs=${JWT_EXPIRATION:86400000}

# === Archivos / Uploads ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads/veterinarios}

# === EMAIL SMTP (credenciales SOLO por variable de entorno) ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# === CORS (origenes permitidos, separados por coma) ===
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# === Logging ===
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.farmacia.sistemaWeb=INFO
logging.level.org.springframework.security=WARN

# === MERCADOPAGO ===
mercadopago.access-token=${MP_ACCESS_TOKEN:TEST-xxx}

# === STRIPE ===
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_xxx}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_xxx}
